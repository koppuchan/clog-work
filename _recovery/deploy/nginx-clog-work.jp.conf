# /etc/nginx/sites-available/clog-work.jp.conf
#
# clog-work.jp 用の Nginx 設定テンプレート（旧サーバー移行時の参考資料）。
# 現行サーバーの実際の設定は /etc/nginx/sites-enabled/attendance-web.conf を参照。
#
# 配置後:
#   ln -sf /etc/nginx/sites-available/clog-work.jp.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# その後 certbot で SSL 取得:
#   certbot --nginx -d clog-work.jp -d www.clog-work.jp \
#     --non-interactive --agree-tos -m admin@clog-work.jp --redirect

server {
    listen 80;
    listen [::]:80;
    server_name clog-work.jp www.clog-work.jp;

    root /var/www/attendance-web/public;

    index index.php;

    charset utf-8;

    access_log /var/log/nginx/clog-work.jp.access.log;
    error_log  /var/log/nginx/clog-work.jp.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # 既存の PHP-FPM ソケット/ポートに合わせてください
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32M;
}
